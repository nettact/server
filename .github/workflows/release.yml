# Release pipeline for server-lite.
#
# Trigger: pushing a semver tag (v1.0.0, v1.0.0-rc.1). Versioning is independent of
# agent/desktop.
#
# Dependency sources: nothing is pinned in this repo. protocol and server-core are
# checked out from their default branches and the commits that land are recorded in
# nettact-lite-dependencies.json, published with the Release. Releases therefore
# never wait on a sibling tag and nobody hand-maintains a SHA.
#
# The trade: a tag no longer rebuilds identically on its own, because the siblings
# move. To reproduce a published release, pass its recorded commits as the
# protocol_ref / server_core_ref dispatch inputs below.
#
# The web console follows the same principle from the other end. Its tag is
# resolved at release time from web-console's latest stable GitHub Release and
# stamped into the binary (ldflags -X); the server downloads that release AT
# RUNTIME from web-console's public GitHub Releases, so nothing is fetched at
# build time. Auto-resolving keeps a server release from shipping a console that
# is already several frontend releases behind, which is what a hand-edited pin
# drifts into. (Desktop is the exception — it compiles the console into the
# binary for Store review, so it fetches the dist at packaging time.)
#
# Required secret: CI_SUBMODULE_SSH_KEY (org-level recommended) — read access to
# nettact/protocol and nettact/server-core.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)release, e.g. v1.0.0
        required: true
      protocol_ref:
        description: >-
          protocol commit to build against. Empty resolves the default branch's
          latest commit. When re-releasing an existing tag, pass the commit from
          that release's nettact-lite-dependencies.json.
        required: false
      server_core_ref:
        description: >-
          server-core commit to build against. Empty resolves the default branch's
          latest commit. When re-releasing an existing tag, pass the commit from
          that release's nettact-lite-dependencies.json.
        required: false
      web_console_version:
        description: >-
          Console tag to stamp, e.g. v0.2.2. Empty resolves the latest stable
          release. When re-releasing an existing server tag, pass the value from
          that release's notes — otherwise a newer console has appeared since and
          the rebuilt artifacts differ from the ones already published.
        required: false

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Test · build · publish
    runs-on: ubuntu-latest
    environment: release          # manual-approval gate
    outputs:
      is_latest: ${{ steps.rel.outputs.is_latest }}
    permissions:
      contents: write             # GitHub Release
      packages: write             # push to GHCR
      id-token: write             # cosign keyless (OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          path: server-lite
          fetch-depth: 0          # need all tags to decide whether this is the newest stable

      # workflow_dispatch runs from a branch ref, so github.sha is the DISPATCH commit,
      # not the released tag's commit. Resolve the real release commit from the checkout,
      # and only move `latest` when this tag is the newest stable tag (re-releasing an
      # old tag must not roll `latest` backward).
      - name: Resolve release commit + latest eligibility
        id: rel
        run: |
          set -euo pipefail
          cd server-lite
          TAG="${{ inputs.tag || github.ref_name }}"
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "sha_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$TAG" == *-* ]]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"   # prerelease never moves latest
          else
            newest=$(git tag -l 'v*' | grep -v -- - | sort -V | tail -1)
            echo "newest stable tag: $newest (releasing: $TAG)"
            [ "$TAG" = "$newest" ] && echo "is_latest=true" >> "$GITHUB_OUTPUT" \
                                   || echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

      # The runtime downloader fetches one exact tag, so "latest" must be turned
      # into a concrete vX.Y.Z here. /releases/latest already excludes drafts and
      # prereleases; the regex additionally rejects anything that is not a plain
      # stable tag.
      #
      # Both assets are then confirmed to exist. The stamped tag is only ever
      # resolved at build time, but it is consumed months later by every deployed
      # binary: a release whose upload was interrupted, or one created by hand,
      # would leave the tag looking valid here while the downloader 404s forever
      # and every fresh install sits on the 503 placeholder. Checking the two
      # filenames the downloader asks for turns that into a failed release.
      - name: Resolve web-console release
        id: webui
        env:
          GH_TOKEN: ${{ github.token }}
          # Empty on a tag push; set only when a dispatch pins the console.
          PINNED: ${{ inputs.web_console_version }}
        run: |
          set -euo pipefail
          owner="${{ github.repository_owner }}"
          if [[ -n "$PINNED" ]]; then
            tag="$PINNED"
            release=$(gh api "repos/${owner}/web-console/releases/tags/${tag}")
            echo "web console: $tag (pinned by workflow_dispatch)"
          else
            release=$(gh api "repos/${owner}/web-console/releases/latest")
            tag=$(jq -r .tag_name <<<"$release")
            echo "web console: $tag (latest stable)"
          fi

          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "web-console release must be a stable vX.Y.Z tag (got '$tag')" >&2
            exit 1
          }
          for asset in SHA256SUMS "web-console-dist-${tag}.tar.gz"; do
            jq -e --arg a "$asset" 'any(.assets[]; .name == $a)' <<<"$release" >/dev/null || {
              echo "web-console ${tag} has no '${asset}' asset; the runtime download would 404 forever" >&2
              exit 1
            }
          done

          echo "version=$tag" >> "$GITHUB_OUTPUT"

      # An empty ref makes actions/checkout use the repository's default branch,
      # which is how "latest protocol / server-core" is expressed here. Whatever
      # commit lands is read back below rather than assumed.
      - name: Checkout protocol
        uses: actions/checkout@v4
        with:
          repository: nettact/protocol
          ref: ${{ inputs.protocol_ref }}
          path: protocol
          ssh-key: ${{ secrets.CI_SUBMODULE_SSH_KEY }}

      - name: Checkout server-core
        uses: actions/checkout@v4
        with:
          repository: nettact/server-core
          ref: ${{ inputs.server_core_ref }}
          path: server-core
          ssh-key: ${{ secrets.CI_SUBMODULE_SSH_KEY }}

      # With no committed pins, the dependency record IS the audit trail: it is the
      # only place that says which sibling sources this binary contains. Published
      # as a Release asset so it outlives the workflow run's log retention, and read
      # by desktop packaging to build server-lite against the same sources.
      - name: Record dependency commits
        id: deps
        run: |
          set -euo pipefail
          # Assigns into the named variable instead of echoing, so the function runs
          # in this shell: a `return 1` then aborts the step under `set -e`. Echoing
          # into $(...) would put the failure in a subshell, leaving the caller to
          # continue with an empty commit.
          read_head() {   # $1=target var, $2=directory
            local dir="$2" sha
            sha=$(git -C "$dir" rev-parse HEAD)
            [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "$dir checkout did not resolve to a full commit (got '$sha')" >&2
              return 1
            }
            printf -v "$1" '%s' "$sha"
          }
          read_head protocol_sha protocol
          read_head server_core_sha server-core
          echo "protocol_sha=$protocol_sha" >> "$GITHUB_OUTPUT"
          echo "server_core_sha=$server_core_sha" >> "$GITHUB_OUTPUT"

          mkdir -p dist-out
          jq -n \
            --arg version "${{ inputs.tag || github.ref_name }}" \
            --arg commit "${{ steps.rel.outputs.sha }}" \
            --arg protocol_sha "$protocol_sha" \
            --arg server_core_sha "$server_core_sha" \
            --arg web_console_version "${{ steps.webui.outputs.version }}" \
            '{
              schema_version: 1,
              "server-lite": {version: $version, commit: $commit},
              sources: {
                protocol: {commit: $protocol_sha},
                "server-core": {commit: $server_core_sha}
              },
              dependencies: {
                "web-console": {version: $web_console_version}
              }
            }' > dist-out/nettact-lite-dependencies.json
          (
            cd dist-out
            sha256sum nettact-lite-dependencies.json > nettact-lite-dependencies.json.sha256
          )
          cat dist-out/nettact-lite-dependencies.json
          {
            echo "## Resolved dependency sources"
            echo
            echo "- protocol: \`$protocol_sha\`"
            echo "- server-core: \`$server_core_sha\`"
            echo "- web-console: ${{ steps.webui.outputs.version }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache-dependency-path: |
            server-lite/go.sum
            server-core/go.sum
            protocol/go.sum

      - name: Assemble workspace (trimmed go.work + versioned replaces)
        run: |
          set -euo pipefail
          go work init ./protocol ./server-core ./server-lite
          go work edit -replace github.com/nettact/protocol@v0.0.0-00010101000000-000000000000=./protocol
          go work edit -replace github.com/nettact/server-core@v0.0.0-00010101000000-000000000000=./server-core

      - name: Gate — vet · build · test (server-lite + server-core)
        run: |
          set -euo pipefail
          ( cd server-core && go vet ./... && go build ./... && go test ./... )
          ( cd server-lite && go vet ./... && go build ./... && go test ./... )

      - name: Cross-compile binaries + checksums
        run: |
          set -euo pipefail
          mkdir -p dist-bins
          for arch in amd64 arm64; do
            ( cd server-lite && CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
                go build -trimpath -ldflags "-s -w -X github.com/nettact/server-lite/internal/webui.Version=${{ steps.webui.outputs.version }}" \
                -o "../dist-bins/nettact-lite-linux-$arch" ./cmd/nettact-lite )
          done
          ( cd dist-bins && sha256sum * > SHA256SUMS && cat SHA256SUMS )

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags & labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nettact-lite
          tags: |
            type=raw,value=${{ inputs.tag || github.ref_name }}
            type=raw,value=latest,enable=${{ steps.rel.outputs.is_latest }}
            type=raw,value=sha-${{ steps.rel.outputs.sha_short }}

      - name: Build & push image (linux/amd64, linux/arm64)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server-lite/ci/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag || github.ref_name }}
            REVISION=${{ steps.rel.outputs.sha }}
            WEBUI_VERSION=${{ steps.webui.outputs.version }}
          provenance: true
          sbom: true
          cache-from: type=gha,scope=lite
          cache-to: type=gha,mode=max,scope=lite

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image (keyless, by digest)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/nettact-lite
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          files: |
            dist-bins/nettact-lite-linux-amd64
            dist-bins/nettact-lite-linux-arm64
            dist-bins/SHA256SUMS
            dist-out/nettact-lite-dependencies.json
            dist-out/nettact-lite-dependencies.json.sha256
            server-lite/deploy/install.sh
          body: |
            ## nettact-lite ${{ inputs.tag || github.ref_name }}

            Built against:
            - `nettact/protocol@${{ steps.deps.outputs.protocol_sha }}`
            - `nettact/server-core@${{ steps.deps.outputs.server_core_sha }}`
            - web-console **${{ steps.webui.outputs.version }}** (downloaded by the server at runtime)

            The Go sources above were resolved from their default branches when this
            build started; `nettact-lite-dependencies.json` is the machine-readable
            record of it. Desktop packaging reads that record to build this server
            against the same sources, and re-releasing this tag reproducibly means
            passing those commits as the workflow's `protocol_ref` / `server_core_ref`
            inputs.

            ### Container image (linux/amd64 · linux/arm64, cosign-signed)
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/nettact-lite:${{ inputs.tag || github.ref_name }}
            ```
            Verify binary integrity with `sha256sum -c SHA256SUMS`.

  publish-installer-r2:
    name: Publish installer to R2
    runs-on: ubuntu-latest
    needs: release
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      PUBLIC_URL: https://d.nettact.org/install.sh
      R2_ACCOUNT_ID: ${{ vars.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate R2 configuration
        run: |
          set -euo pipefail
          : "${R2_ACCOUNT_ID:?Set the R2_ACCOUNT_ID repository variable}"
          : "${R2_BUCKET:?Set the R2_BUCKET repository variable}"
          : "${AWS_ACCESS_KEY_ID:?Set the R2_ACCESS_KEY_ID repository secret}"
          : "${AWS_SECRET_ACCESS_KEY:?Set the R2_SECRET_ACCESS_KEY repository secret}"

      - name: Download installer asset
        run: |
          set -euo pipefail
          mkdir -p dist-out
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist-out --pattern 'install.sh'
          test -f dist-out/install.sh
          bash -n dist-out/install.sh

      - name: Publish immutable version path
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp dist-out/install.sh "s3://${R2_BUCKET}/server-lite/$TAG/install.sh" --endpoint-url "$endpoint" --no-progress --only-show-errors --cache-control 'public, max-age=31536000, immutable' --content-type 'text/x-shellscript'

      - name: Publish latest installer
        if: needs.release.outputs.is_latest == 'true'
        run: |
          set -euo pipefail
          endpoint="https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
          aws s3 cp dist-out/install.sh "s3://${R2_BUCKET}/install.sh" --endpoint-url "$endpoint" --no-progress --only-show-errors --cache-control 'public, max-age=300' --content-type 'text/x-shellscript'

      - name: Publish download summary
        run: |
          {
            echo "## R2 installer"
            echo
            echo "- Version: $TAG"
            echo "- Latest stable: $PUBLIC_URL"
            echo "- Versioned: https://d.nettact.org/server-lite/$TAG/install.sh"
          } >> "$GITHUB_STEP_SUMMARY"

# IP→ASN table publishing for route monitoring.
#
# Weekly (and on demand), take a snapshot of iptoasn.com's ip2asn-v4 table,
# validate it with ci/asndb — the same parser and sanity floor a server applies
# when it installs the table — and publish it as a GitHub Release tagged
# asn-YYYYMMDD with three assets: ip2asn-v4.tsv.gz, asn-db.json (the manifest)
# and SHA256SUMS. Servers install it through the download center
# (<base>/asn-db.json for the newest snapshot, <base>/<tag>/<asset> for files);
# see internal/asndb.
#
# These releases live beside the server's own vX.Y.Z releases, so two rules
# keep them out of its way:
#   - they are created with --latest=false, so "the latest release of this
#     repository" keeps meaning the newest server release;
#   - only the newest KEEP snapshots are retained (release and tag deleted), so
#     weekly snapshots never crowd server releases out of release listings.
#     A server always downloads the snapshot its freshly fetched manifest names,
#     so pruning older snapshots breaks nothing.
#
# Required secret: CI_SUBMODULE_SSH_KEY — read access to nettact/protocol and
# nettact/server-core (the validator imports server-core's asnlookup).

name: ASN table

on:
  schedule:
    - cron: '17 3 * * 1'   # Mondays 03:17 UTC
  workflow_dispatch:

concurrency:
  group: asn-db
  cancel-in-progress: false

permissions:
  contents: read

env:
  UPSTREAM: https://iptoasn.com/data/ip2asn-v4.tsv.gz
  KEEP: '3'

jobs:
  publish:
    name: Snapshot · validate · publish
    runs-on: ubuntu-latest
    permissions:
      contents: write             # create / prune GitHub Releases
    steps:
      - name: Resolve snapshot version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(date -u +%Y%m%d)
          tag="asn-$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$tag already published; nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.ver.outputs.exists == 'false'
        with:
          path: server

      - name: Checkout protocol
        if: steps.ver.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: nettact/protocol
          path: protocol
          ssh-key: ${{ secrets.CI_SUBMODULE_SSH_KEY }}

      - name: Checkout server-core
        if: steps.ver.outputs.exists == 'false'
        uses: actions/checkout@v4
        with:
          repository: nettact/server-core
          path: server-core
          ssh-key: ${{ secrets.CI_SUBMODULE_SSH_KEY }}

      - uses: actions/setup-go@v5
        if: steps.ver.outputs.exists == 'false'
        with:
          go-version: '1.25'
          cache-dependency-path: |
            server/go.sum
            server-core/go.sum
            protocol/go.sum

      - name: Assemble workspace
        if: steps.ver.outputs.exists == 'false'
        run: |
          set -euo pipefail
          go work init ./protocol ./server-core ./server
          go work edit -replace github.com/nettact/protocol@v0.0.0-00010101000000-000000000000=./protocol
          go work edit -replace github.com/nettact/server-core@v0.0.0-00010101000000-000000000000=./server-core

      - name: Download and validate snapshot
        if: steps.ver.outputs.exists == 'false'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-delay 10 -o ip2asn-v4.tsv.gz "$UPSTREAM"
          ( cd server && go run ./ci/asndb \
              -in ../ip2asn-v4.tsv.gz -out ../dist-asn -version "${{ steps.ver.outputs.version }}" )
          ( cd dist-asn && sha256sum -c SHA256SUMS )
          {
            echo "## ${{ steps.ver.outputs.tag }}"
            echo
            echo '```json'
            cat dist-asn/asn-db.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish release
        if: steps.ver.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ steps.ver.outputs.tag }}"
          gh release create "$tag" \
            --repo "$GITHUB_REPOSITORY" \
            --target "${{ github.sha }}" \
            --title "IP-to-ASN table ${{ steps.ver.outputs.version }}" \
            --notes "Snapshot of iptoasn.com ip2asn-v4 (public domain, PDDL-1.0) for route monitoring. Installed automatically by servers through the download center; not a server release." \
            --latest=false \
            dist-asn/ip2asn-v4.tsv.gz dist-asn/asn-db.json dist-asn/SHA256SUMS

      # Runs even when today's snapshot already existed, so a manual dispatch
      # also tidies up after an interrupted earlier prune.
      - name: Prune old snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq '.[].tagName | select(test("^asn-[0-9]{8}$"))' \
            | sort -r | tail -n +"$((KEEP + 1))" \
            | while read -r old; do
                echo "pruning $old"
                gh release delete "$old" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes
              done
